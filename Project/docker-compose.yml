services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: eventapi-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
  
  redis:
    image: redis:7.2-alpine
    container_name: eventapi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  users-db:
    image: postgres:16-alpine
    container_name: users-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users_db
    ports:
      - "5433:5432"
    volumes:
      - users_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  events-db:
    image: postgres:16-alpine
    container_name: events-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: events_db
    ports:
      - "5434:5432"
    volumes:
      - events_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d events_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  bookings-db:
    image: postgres:16-alpine
    container_name: bookings-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookings_db
    ports:
      - "5435:5432"
    volumes:
      - bookings_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookings_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  users-api:
    build:
      context: .
      dockerfile: Users.Presentation/Dockerfile
    container_name: users-api
    restart: unless-stopped
    depends_on:
      users-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=users-db;Port=5432;Database=users_db;Username=postgres;Password=postgres
      JWTSettings__Secret: your-super-secret-key-min-32-characters!
      JWTSettings__Issuer: EventBooking
      JWTSettings__Audience: EventBookingClient
      JWTSettings__ExpirationHours: 1
    ports:
      - "5001:8080"

  events-api:
    build:
      context: .
      dockerfile: Events.Presentation/Dockerfile
    container_name: events-api
    restart: unless-stopped
    depends_on:
      events-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=events-db;Port=5432;Database=events_db;Username=postgres;Password=postgres
      JWTSettings__Secret: your-super-secret-key-min-32-characters!
      JWTSettings__Issuer: EventBooking
      JWTSettings__Audience: EventBookingClient
      JWTSettings__ExpirationHours: 1
      Kafka__BootstrapServers: kafka:29092
      Kafka__GroupId: order-processing
      Redis__Host: redis
      Redis__Port: 6379
    ports:
      - "5002:8080"

  bookings-api:
    build:
      context: .
      dockerfile: Bookings.Presentation/Dockerfile
    container_name: bookings-api
    restart: unless-stopped
    depends_on:
      bookings-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=bookings-db;Port=5432;Database=bookings_db;Username=postgres;Password=postgres
      JWTSettings__Secret: your-super-secret-key-min-32-characters!
      JWTSettings__Issuer: EventBooking
      JWTSettings__Audience: EventBookingClient
      JWTSettings__ExpirationHours: 1
      Kafka__BootstrapServers: kafka:29092
    ports:
      - "5003:8080"

volumes:
  users_pgdata:
  events_pgdata:
  bookings_pgdata: